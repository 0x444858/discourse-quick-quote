quick_quote_post_location_threshold:
  type: integer
  default: 1
  description:
    en: "Number of posts back before fast quote enabled."
    zh_CN: "距离最新帖子多少层以内时，快速引用功能将被禁用（设为 0 表示始终启用）。"
quick_quote_character_limit:
  type: integer
  default: 100
  description:
    en: "Quote character limit (uses first x chars if total length is greater)"
    zh_CN: "引用内容字符数限制（超过使用开头的 x 个字符）"
quick_quote_keep_link_reachable:
  type: bool
  default: true
  description:
    en: "When truncating, only truncate link display text, keeping the URL intact so links remain clickable."
    zh_CN: "截断时仅截断链接的显示文字，保留完整 URL，确保截断后的链接仍然可点击。"
quick_quote_truncate_bare_links:
  type: bool
  default: false
  description:
    en: "Proactively truncate bare URL links (where display text equals href) after the first path segment."
    zh_CN: "主动截断裸链接（显示文字与 URL 相同的链接），仅保留第一个路径段。"
quick_quote_double_width_unicode:
  type: bool
  default: true
  description:
    en: "Count non-ASCII characters as double-width when truncating, so mixed-language text has a consistent visual cut point."
    zh_CN: "截断时将非 ASCII 字符计为 2 倍宽度，使中英文混排时截断后的视觉长度更加接近。"
quick_quote_keep_image:
  type: bool
  default: true
  description:
    en: "Preserve images in quotes, output as ![title](url) Markdown. Applies to all images except emoji (which are always preserved as raw text)."
    zh_CN: "在引用中保留图片，输出为 ![title](url) Markdown 格式。适用于所有非 emoji 图片（emoji 始终保留为原始文本）。"
quick_quote_image_character_width:
  type: integer
  default: 40
  description:
    en: "Fixed number of characters an image occupies in the quote character budget. Images are kept whole or dropped entirely — no partial truncation."
    zh_CN: "图片在引用字符限制中占用的固定宽度。图片要么完整保留，要么被整体丢弃——不会有部分截断。"
quick_quote_image_use_thumbnail:
  type: bool
  default: true
  description:
    en: "Use the thumbnail URL (img src) for lightbox images instead of the original image URL (a href)."
    zh_CN: "用户上传的图片使用缩略图地址（img src）而非原图地址（a href）。"
